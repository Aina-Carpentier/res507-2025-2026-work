name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "24"

    - name: Install dependencies
      working-directory: labs/40-containerized-node-app/app
      run: npm ci

    - name: Run tests if present
      working-directory: labs/40-containerized-node-app/app
      run: npm test --if-present
  
    - name: Build Docker image
      working-directory: labs/40-containerized-node-app/
      run: docker build -t quote-app -f docker/Dockerfile .

    - name: Run container
      run: |
        docker run -d --name quote-app -p 3000:3000 quote-app
        for i in $(seq 1 10); do
          response=$(curl -sS http://localhost:3000/health 2>/dev/null || echo "")
          echo "Attempt $i - Response: $response"
          if echo "$response" | grep -q '"ok":true'; then
            echo "Health check passed with response: $response"
            exit 0
          fi
          sleep 1
        done
        echo "Health check failed after 10 seconds"
        echo "=== Docker container status ==="
        docker ps -a || echo "Failed to get docker ps"
        echo "=== Container logs ==="
        docker logs quote-app || echo "Failed to get container logs"
        echo "=== Port check ==="
        netstat -tuln | grep 3000 || echo "Port 3000 not listening"
        echo "=== Direct curl attempt ==="
        curl -v http://localhost:3000/health || echo "Failed to curl health endpoint"
        exit 1

    - name: Stop container
      if: always()
      run: |
        docker rm -f quote-app || echo "Failed to stop container"