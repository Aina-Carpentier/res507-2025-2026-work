<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" font-family="Arial, sans-serif" font-size="13">
  <!-- Background -->
  <rect width="900" height="680" fill="#f8f9fa" rx="8"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">Production Architecture - Quote API</text>

  <!-- Users -->
  <rect x="370" y="50" width="160" height="40" rx="20" fill="#6c5ce7" stroke="#5a4bd1" stroke-width="2"/>
  <text x="450" y="75" text-anchor="middle" fill="white" font-weight="bold">Users (Internet)</text>

  <!-- Arrow Users -> Ingress -->
  <line x1="450" y1="90" x2="450" y2="120" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Kubernetes Cluster Box -->
  <rect x="40" y="120" width="820" height="530" rx="10" fill="none" stroke="#2d3436" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="60" y="145" font-size="14" font-weight="bold" fill="#2d3436">Kubernetes Cluster</text>

  <!-- Ingress Controller -->
  <rect x="330" y="155" width="240" height="45" rx="8" fill="#00b894" stroke="#00a381" stroke-width="2"/>
  <text x="450" y="173" text-anchor="middle" fill="white" font-size="12">Ingress Controller (Nginx)</text>
  <text x="450" y="190" text-anchor="middle" fill="white" font-size="11">TLS Termination</text>

  <!-- Arrow Ingress -> Service -->
  <line x1="450" y1="200" x2="450" y2="230" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- App Service -->
  <rect x="330" y="230" width="240" height="40" rx="8" fill="#0984e3" stroke="#0770c2" stroke-width="2"/>
  <text x="450" y="255" text-anchor="middle" fill="white" font-weight="bold">Service: quote-api (ClusterIP)</text>

  <!-- Arrow Service -> Pods -->
  <line x1="350" y1="270" x2="180" y2="310" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="270" x2="450" y2="310" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="270" x2="720" y2="310" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 1 -->
  <rect x="60" y="300" width="250" height="130" rx="6" fill="#dfe6e9" stroke="#b2bec3" stroke-width="1.5"/>
  <text x="185" y="320" text-anchor="middle" font-size="11" fill="#636e72">Node 1</text>

  <!-- Pod 1 -->
  <rect x="80" y="330" width="210" height="85" rx="6" fill="#74b9ff" stroke="#0984e3" stroke-width="1.5"/>
  <text x="185" y="352" text-anchor="middle" font-weight="bold" fill="#2d3436" font-size="12">Pod: quote-api (1/3)</text>
  <text x="185" y="370" text-anchor="middle" fill="#2d3436" font-size="10">Container: quote-api</text>
  <text x="185" y="385" text-anchor="middle" fill="#2d3436" font-size="10">Liveness: /health</text>
  <text x="185" y="400" text-anchor="middle" fill="#2d3436" font-size="10">Readiness: /ready</text>

  <!-- Node 2 -->
  <rect x="325" y="300" width="250" height="130" rx="6" fill="#dfe6e9" stroke="#b2bec3" stroke-width="1.5"/>
  <text x="450" y="320" text-anchor="middle" font-size="11" fill="#636e72">Node 2</text>

  <!-- Pod 2 -->
  <rect x="345" y="330" width="210" height="85" rx="6" fill="#74b9ff" stroke="#0984e3" stroke-width="1.5"/>
  <text x="450" y="352" text-anchor="middle" font-weight="bold" fill="#2d3436" font-size="12">Pod: quote-api (2/3)</text>
  <text x="450" y="370" text-anchor="middle" fill="#2d3436" font-size="10">Container: quote-api</text>
  <text x="450" y="385" text-anchor="middle" fill="#2d3436" font-size="10">Liveness: /health</text>
  <text x="450" y="400" text-anchor="middle" fill="#2d3436" font-size="10">Readiness: /ready</text>

  <!-- Node 3 -->
  <rect x="590" y="300" width="250" height="130" rx="6" fill="#dfe6e9" stroke="#b2bec3" stroke-width="1.5"/>
  <text x="715" y="320" text-anchor="middle" font-size="11" fill="#636e72">Node 3</text>

  <!-- Pod 3 -->
  <rect x="610" y="330" width="210" height="85" rx="6" fill="#74b9ff" stroke="#0984e3" stroke-width="1.5"/>
  <text x="715" y="352" text-anchor="middle" font-weight="bold" fill="#2d3436" font-size="12">Pod: quote-api (3/3)</text>
  <text x="715" y="370" text-anchor="middle" fill="#2d3436" font-size="10">Container: quote-api</text>
  <text x="715" y="385" text-anchor="middle" fill="#2d3436" font-size="10">Liveness: /health</text>
  <text x="715" y="400" text-anchor="middle" fill="#2d3436" font-size="10">Readiness: /ready</text>

  <!-- Arrows Pods -> DB Service -->
  <line x1="185" y1="430" x2="350" y2="480" stroke="#e17055" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <line x1="450" y1="430" x2="450" y2="480" stroke="#e17055" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <line x1="715" y1="430" x2="550" y2="480" stroke="#e17055" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <!-- DB Service -->
  <rect x="330" y="480" width="240" height="40" rx="8" fill="#e17055" stroke="#d14b2f" stroke-width="2"/>
  <text x="450" y="505" text-anchor="middle" fill="white" font-weight="bold">Service: postgres (ClusterIP)</text>

  <!-- Arrow DB Service -> StatefulSet -->
  <line x1="450" y1="520" x2="450" y2="550" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- DB Node -->
  <rect x="270" y="545" width="360" height="95" rx="6" fill="#dfe6e9" stroke="#b2bec3" stroke-width="1.5"/>
  <text x="450" y="563" text-anchor="middle" font-size="11" fill="#636e72">Dedicated Node (StatefulSet)</text>

  <!-- DB Pod -->
  <rect x="290" y="570" width="180" height="60" rx="6" fill="#fdcb6e" stroke="#f39c12" stroke-width="1.5"/>
  <text x="380" y="590" text-anchor="middle" font-weight="bold" fill="#2d3436" font-size="12">Pod: PostgreSQL</text>
  <text x="380" y="607" text-anchor="middle" fill="#2d3436" font-size="10">Probe: pg_isready</text>
  <text x="380" y="622" text-anchor="middle" fill="#2d3436" font-size="10">Secret: db-credentials</text>

  <!-- PVC -->
  <rect x="490" y="570" width="120" height="60" rx="6" fill="#a29bfe" stroke="#6c5ce7" stroke-width="1.5"/>
  <text x="550" y="595" text-anchor="middle" fill="white" font-weight="bold" font-size="11">PVC</text>
  <text x="550" y="612" text-anchor="middle" fill="white" font-size="10">10Gi (Retain)</text>

  <!-- Secret icon -->
  <rect x="70" y="490" width="140" height="40" rx="8" fill="#636e72" stroke="#2d3436" stroke-width="1.5"/>
  <text x="140" y="515" text-anchor="middle" fill="white" font-size="11" font-weight="bold">K8s Secret</text>

  <!-- Dotted lines from secret -->
  <line x1="210" y1="505" x2="290" y2="505" stroke="#636e72" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="140" y1="490" x2="185" y2="430" stroke="#636e72" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- HPA -->
  <rect x="690" y="490" width="140" height="40" rx="8" fill="#00cec9" stroke="#00b5ad" stroke-width="1.5"/>
  <text x="760" y="515" text-anchor="middle" fill="white" font-size="11" font-weight="bold">HPA (autoscaler)</text>

  <!-- Dotted line from HPA to pods -->
  <line x1="760" y1="490" x2="715" y2="430" stroke="#00cec9" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Legend -->
  <rect x="60" y="155" width="12" height="12" fill="#74b9ff" stroke="#0984e3"/>
  <text x="78" y="166" font-size="10" fill="#2d3436">App Pod</text>
  <rect x="60" y="173" width="12" height="12" fill="#fdcb6e" stroke="#f39c12"/>
  <text x="78" y="184" font-size="10" fill="#2d3436">DB Pod</text>
  <rect x="60" y="191" width="12" height="12" fill="#a29bfe" stroke="#6c5ce7"/>
  <text x="78" y="202" font-size="10" fill="#2d3436">Persistent Volume</text>
  <rect x="60" y="209" width="12" height="12" fill="#0984e3" stroke="#0770c2"/>
  <text x="78" y="220" font-size="10" fill="#2d3436">Service</text>

  <!-- Rolling Update Label -->
  <text x="450" y="455" text-anchor="middle" font-size="10" fill="#636e72" font-style="italic">RollingUpdate: maxUnavailable=0, maxSurge=1</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e17055"/>
    </marker>
  </defs>
</svg>
